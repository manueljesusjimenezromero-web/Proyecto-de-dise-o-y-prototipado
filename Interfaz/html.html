                <figure class="documento" aria-label="Fragmento de la Declaración de los Derechos del Hombre y del Ciudadano">

                    <h2>
                        Declaración de los Derechos del Hombre<br>
                        y del Ciudadano
                    </h2>

                    <p class="sub">
                        Asamblea Nacional · 26 de agosto de 1789
                    </p>

                    <p>
                        <b>Art. 1.</b> Los hombres nacen y permanecen libres e iguales en derechos.
                        Las distinciones sociales solo pueden fundarse en la utilidad común.
                    </p>

                    <p>
                        <b><strong>Art. 2.</strong></b> El fin de toda asociación política es la conservación de los
                        derechos naturales e imprescriptibles del ser humano. Estos derechos son la
                        libertad, la propiedad, la seguridad y la resistencia a la opresión.
                    </p>

                    <p>
                        <b><strong>Art. 3.</strong></b> El principio de toda soberanía reside esencialmente en la Nación.
                    </p>
